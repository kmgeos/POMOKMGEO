<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro Custom Theme</title>
  <!-- Archivo CSS externo -->
  <link rel="stylesheet" href="css/pomodoro.css">
</head>
<body class="mode-pomodoro">

<div class="app-container">
  
  <!-- SECCIÓN TEMPORIZADOR -->
  <div class="card timer-section">
    <div class="top-bar">
      <button class="icon-btn" id="open-settings">⚙ Setting</button>
    </div>

    <div class="mode-buttons">
      <button class="mode-btn active" id="btn-pomodoro" onclick="switchMode('pomodoro')">Pomodoro</button>
      <button class="mode-btn" id="btn-shortBreak" onclick="switchMode('shortBreak')">Short Break</button>
      <button class="mode-btn" id="btn-longBreak" onclick="switchMode('longBreak')">Long Break</button>
    </div>

    <!-- 1. GIF -->
    <div class="gif-container">
      <img id="gif-display" class="gif-display" src="https://i.gifer.com/XOsX.gif" alt="GIF Pomodoro">
    </div>

    <!-- 2. NOMBRE DE LA TAREA SELECCIONADA -->
    <div class="task-title-display" id="task-title-display">
      LABORAL PELICULA
    </div>

    <!-- 3. CANTIDAD DE POMODOROS -->
    <div class="pomodoro-counter" id="pomodoro-counter">
      Pomodoro #1 / 4
    </div>

    <!-- 4. TIEMPO -->
    <div class="timer-display" id="timer-display">25:00</div>

    <!-- 5. BOTONES -->
    <div class="controls-row">
      <button class="secondary-btn" onclick="resetTimer()" title="Reiniciar">↺</button>
      <button class="main-btn" id="start-btn" onclick="toggleTimer()">START</button>
      <button class="secondary-btn" onclick="skipPhase()" title="Saltar">⏭</button>
    </div>
  </div>

  <!-- SECCIÓN DE MATERIAS Y TAREAS -->
  <div class="card tasks-section">
    <h2>Tasks</h2>
    
    <div class="active-task-selector">
      <label>Tarea Actual en Trabajo:</label>
      <select id="active-task-select" onchange="updateTaskTitle()"></select>
    </div>

    <div id="groups-container"></div>

    <div class="add-form">
      <input type="text" id="new-group-name" placeholder="+ Nueva materia/grupo...">
      <button onclick="addGroup()">Crear Materia</button>
    </div>

    <div class="add-form">
      <select id="group-add-select"></select>
      <input type="text" id="new-task-name" placeholder="+ Nueva tarea...">
      <button onclick="addTask()">Agregar Tarea</button>
    </div>
  </div>

</div>

<!-- VENTANA MODAL (SETTING) -->
<div class="modal-overlay" id="modal-settings">
  <div class="modal-card">
    <div class="modal-header">
      <span>⚙ SETTING</span>
      <span class="close-btn" onclick="closeSettings()">&times;</span>
    </div>

    <!-- SECCIÓN TIMER -->
    <div class="section-title">⏱ TIMER</div>

    <div class="setting-group">
      <label>Time (minutes)</label>
      <div class="time-inputs">
        <div class="time-field">
          <span>Pomodoro</span>
          <input type="number" id="input-pomo" value="25" min="1">
        </div>
        <div class="time-field">
          <span>Short Break</span>
          <input type="number" id="input-short" value="5" min="1">
        </div>
        <div class="time-field">
          <span>Long Break</span>
          <input type="number" id="input-long" value="15" min="1">
        </div>
      </div>
    </div>

    <div class="setting-group">
      <div class="toggle-row">
        <span>Long Break interval</span>
        <input type="number" id="input-interval" value="4" min="1" style="width: 70px; text-align: center;">
      </div>
    </div>

    <!-- SECCIÓN THEME -->
    <div class="section-title">🎨 THEME</div>

    <div class="setting-group">
      <div class="toggle-row">
        <span>Color Themes</span>
        <div class="color-pickers-row">
          <div class="color-box-wrapper">
            <input type="color" id="picker-pomo" class="color-input-box" value="#6b4c9a" title="Color Pomodoro">
            <span>Pomo</span>
          </div>
          <div class="color-box-wrapper">
            <input type="color" id="picker-short" class="color-input-box" value="#2d8883" title="Color Short Break">
            <span>Short</span>
          </div>
          <div class="color-box-wrapper">
            <input type="color" id="picker-long" class="color-input-box" value="#397097" title="Color Long Break">
            <span>Long</span>
          </div>
        </div>
      </div>
    </div>

    <div class="setting-group">
      <div class="toggle-row">
        <span>Dark Mode when running</span>
        <label class="switch">
          <input type="checkbox" id="input-dark-running" checked>
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <div class="setting-group">
      <div class="toggle-row">
        <span>Small Window</span>
        <button class="small-win-btn" onclick="openSmallWindow()">Open ↗</button>
      </div>
    </div>

    <div class="setting-group">
      <label>🖼 GIF URL</label>
      <input type="text" id="input-gif" value="https://i.gifer.com/XOsX.gif">
    </div>

    <div class="modal-footer">
      <button class="save-btn" onclick="saveSettings()">Guardar</button>
    </div>
  </div>
</div>

<!-- Archivos JavaScript (en orden de dependencia) -->
<script src="js/data.js"></script>
<script src="js/task.js"></script>
<script src="js/pomodoro.js"></script>

</body>
</html>
